<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 Arial, sans-serif; width: 220px; padding: 12px; }
      h3 { margin: 0 0 8px; font-size: 14px; }
      button { width: 100%; padding: 8px; margin-top: 6px; border: none; border-radius: 4px; cursor: pointer; font: inherit; }
      .primary { background: #1a73e8; color: white; }
      .danger { background: #fce8e6; color: #c5221f; }
      .secondary { background: #f1f3f4; color: #1a73e8; }
      #count { font-size: 24px; font-weight: bold; }
      #version { margin-top: 10px; text-align: center; font-size: 11px; color: #999; }
    </style>
  </head>
  <body>
    <h3>Street Sign Capture</h3>
    <div id="count">0</div>
    <div>captures saved</div>
    <button id="export" class="primary">Export CSV</button>
    <button id="clear" class="danger">Clear all</button>
    <button id="best-practices" class="secondary">Guide &amp; Best Practices</button>
    <div id="ml-block">
      <hr>
      <div id="retrain-status">Checking retrain status...</div>
      <button id="retrain" class="primary" disabled>Retrain now</button>
      <div id="accuracy-info" style="margin-top: 8px; font-size: 11px; color: #333; line-height: 1.5;"></div>
      <button id="view-report" class="primary" disabled>View Report</button>
    </div>
    <div id="version"></div>
    <script src="retrain-visibility.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
